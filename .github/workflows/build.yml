name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk CamRec.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CamRec-apk
          path: CamRec.apk

      - name: Move the latest tag to this build
        run: |
          git tag -f latest
          git push -f origin latest

      - name: Publish as "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: CamRec (latest build)
          body: "Build ${{ github.run_number }} from ${{ github.sha }}. Download CamRec.apk below and open it on your phone to install."
          files: CamRec.apk
          make_latest: true

